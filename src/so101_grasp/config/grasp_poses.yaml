so101_pick_place:
  ros__parameters:
    # Units: radians. Absolute poses taught with RViz Plan + Execute.
    # For ROS2 Humble + MoveIt2 fake hardware / RViz testing only.
    pose_reference: absolute
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    planning_time: 5.0
    state_timeout: 5.0
    server_timeout: 10.0
    # Per-stage target distance from the freshly measured state, per joint.
    max_stage_joint_delta: 2.0
    # Allowed trajectory overshoot beyond each current-to-target interval.
    # URDF/MoveIt position limits still apply independently.
    trajectory_margin: 0.15

    poses:
      home:
        shoulder_pan: 0.0
        shoulder_lift: 0.0
        elbow_flex: 0.0
        wrist_flex: 0.0
        wrist_roll: 0.0
      pre_grasp:
        shoulder_pan: 0.000005
        shoulder_lift: 0.932312
        elbow_flex: -1.154156
        wrist_flex: 1.788004
        wrist_roll: 0.000009
      grasp:
        shoulder_pan: 0.0
        shoulder_lift: 0.855067
        elbow_flex: -0.730101
        wrist_flex: 1.446477
        wrist_roll: 0.0
      lift:
        shoulder_pan: 0.0
        shoulder_lift: 0.888777
        elbow_flex: -1.031116
        wrist_flex: 1.713782
        wrist_roll: 0.0
      transfer:
        shoulder_pan: 0.510016
        shoulder_lift: 0.882479
        elbow_flex: -1.032558
        wrist_flex: 1.704936
        wrist_roll: -0.002473
      place:
        shoulder_pan: 0.510016
        shoulder_lift: 0.858567
        elbow_flex: -0.727040
        wrist_flex: 1.451906
        wrist_roll: -0.002473
      retreat:
        shoulder_pan: 0.510016
        shoulder_lift: 0.882479
        elbow_flex: -1.032558
        wrist_flex: 1.704936
        wrist_roll: -0.002473
      gripper_open:
        gripper: 1.605704
      gripper_closed:
        gripper: 0.006981
